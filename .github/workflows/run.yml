name: Follow upstream releases (CN minus HK)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: patched-upstream-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository != 'Loyalsoldier/v2ray-rules-dat'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: Loyalsoldier/v2ray-rules-dat
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM_REPO/releases/latest" > "$RUNNER_TEMP/upstream.json"
          tag=$(jq -r '.tag_name' "$RUNNER_TEMP/upstream.json")
          [[ "$tag" =~ ^[0-9]{12}$ ]] || { echo 'Unexpected upstream tag'; exit 1; }
          patched_tag="$tag"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          state=$(jq -r --arg tag "$patched_tag" \
            'map(select(.tagName == $tag)) | first | if . == null then "missing" elif .isDraft then "draft" else "published" end' \
            "$RUNNER_TEMP/releases.json")
          printf 'tag=%s\npatched_tag=%s\nstate=%s\n' "$tag" "$patched_tag" "$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == published ]]; then
            echo "Already published: $patched_tag"
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test postprocessing and packaging
        if: steps.upstream.outputs.needed == 'true'
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Download, verify, and patch upstream assets
        if: steps.upstream.outputs.needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM_REPO" --dir "$RUNNER_TEMP/assets"
          python3 -B scripts/patch_release.py "$RUNNER_TEMP/assets" \
            --metadata "$RUNNER_TEMP/upstream.json" --commit "$GITHUB_SHA"
          printf 'Upstream: https://github.com/%s/releases/tag/%s\n\nPatch: CN minus HK, IPv4 and IPv6.\nOther GeoIP categories and standalone upstream assets are preserved.\ngeoip.dat, rules.zip and their SHA256 checksums are updated together.\nPatch source commit: %s\n' \
            "$UPSTREAM_REPO" "$UPSTREAM_TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        if: steps.upstream.outputs.needed == 'true' && steps.upstream.outputs.state == 'missing'
        env:
          PATCHED_TAG: ${{ steps.upstream.outputs.patched_tag }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          gh release create "$PATCHED_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$UPSTREAM_TAG (CN minus HK)" \
            --draft --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Upload all assets, then publish
        if: steps.upstream.outputs.needed == 'true'
        env:
          PATCHED_TAG: ${{ steps.upstream.outputs.patched_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$PATCHED_TAG" "$RUNNER_TEMP/assets/"* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$PATCHED_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest

      - name: Record the published upstream version
        if: steps.upstream.outputs.needed == 'true'
        env:
          PATCHED_TAG: ${{ steps.upstream.outputs.patched_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/assets/patch-info.json" upstream-release.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream-release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): record $PATCHED_TAG"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
